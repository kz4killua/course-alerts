[project]
name = "coursealerts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.12.14",
    "celery==5.4.0",
    "dj-database-url==2.2.0",
    "django==5.1.15",
    "django-celery-beat==2.7.0",
    "django-cleanup==9.0.0",
    "django-cors-headers==4.4.0",
    "django-filter==24.3",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.5.1",
    "gevent==24.2.1",
    "gunicorn==23.0.0",
    "psycopg2-binary==2.9.10",
    "redis==5.0.8",
    "twilio==9.3.6",
]

[dependency-groups]
dev = [
    "ruff>=0.12.10",
]

[tool.ruff]
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]